<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="neonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Glowing Cat Head Outline -->
  <path d="M 30 78 C 18 70 16 48 24 35 L 20 16 C 30 18 36 24 40 28 C 46 26 54 26 60 28 C 64 24 70 18 80 16 L 76 35 C 84 48 82 70 70 78 C 58 84 42 84 30 78 Z" 
        stroke="url(#neonGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#neonGlow)"/>

  <!-- Inside Medical Cross + Heartbeat combination -->
  <rect x="47" y="44" width="6" height="18" rx="2.5" fill="#ffffff" filter="drop-shadow(0 0 6px #38bdf8)"/>
  <rect x="41" y="50" width="18" height="6" rx="2.5" fill="#ffffff" filter="drop-shadow(0 0 6px #a855f7)"/>
</svg>