<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" fill="none">
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="padGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="stethGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Sparkles -->
  <g fill="#fde047" opacity="0.9">
    <path d="M40 90 L43 97 L50 100 L43 103 L40 110 L37 103 L30 100 L37 97 Z" />
    <path d="M290 60 L292 65 L297 67 L292 69 L290 74 L288 69 L283 67 L288 65 Z" />
    <circle cx="270" cy="95" r="3" fill="#38bdf8"/>
    <circle cx="65" cy="50" r="2.5" fill="#c084fc"/>
  </g>

  <!-- Cat Tail -->
  <path d="M230 180 C270 170 285 200 270 225 C255 245 220 230 220 210" fill="#ffffff" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- Body / Doctor Coat -->
  <path d="M120 180 Q160 170 200 180 L225 250 Q160 265 95 250 Z" fill="url(#coatGrad)" stroke="#cbd5e1" stroke-width="3"/>
  <!-- Coat Lapel & Stethoscope -->
  <path d="M140 180 L160 215 L180 180" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <path d="M130 185 C130 220 190 220 190 185" fill="none" stroke="url(#stethGrad)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="160" cy="225" r="8" fill="#38bdf8" stroke="#0284c7" stroke-width="3"/>
  <circle cx="160" cy="225" r="3" fill="#ffffff"/>

  <!-- Cat Ears -->
  <path d="M110 95 L80 40 Q95 35 125 60 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <path d="M95 55 L115 70 L95 80 Z" fill="#fbcfe8"/>

  <path d="M210 95 L240 40 Q225 35 195 60 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <path d="M225 55 L205 70 L225 80 Z" fill="#fbcfe8"/>

  <!-- Cat Head -->
  <ellipse cx="160" cy="115" rx="65" ry="55" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Doctor Cap / Headband (Optional mini cross) -->
  <rect x="153" y="65" width="14" height="4" rx="2" fill="#38bdf8"/>
  <rect x="158" y="60" width="4" height="14" rx="2" fill="#38bdf8"/>

  <!-- Cheerful Eyes -->
  <ellipse cx="135" cy="110" rx="6" ry="8" fill="#1e293b"/>
  <circle cx="133" cy="107" r="2.5" fill="#ffffff"/>
  <ellipse cx="185" cy="110" rx="6" ry="8" fill="#1e293b"/>
  <circle cx="183" cy="107" r="2.5" fill="#ffffff"/>

  <!-- Cute Cat Nose & Smiling Mouth -->
  <polygon points="160,118 157,114 163,114" fill="#f472b6"/>
  <path d="M153 122 Q160 126 160 120 Q160 126 167 122" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="120" cy="120" rx="9" ry="5" fill="#fbcfe8" opacity="0.8"/>
  <ellipse cx="200" cy="120" rx="9" ry="5" fill="#fbcfe8" opacity="0.8"/>

  <!-- Whiskers -->
  <line x1="105" y1="115" x2="80" y2="112" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="105" y1="122" x2="82" y2="125" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="215" y1="115" x2="240" y2="112" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="215" y1="122" x2="238" y2="125" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

  <!-- Medical Tablet / Clipboard held in Paws -->
  <g transform="translate(60, 140) rotate(-10)">
    <rect x="0" y="0" width="70" height="90" rx="14" fill="url(#padGrad)" stroke="#ffffff" stroke-width="3" filter="drop-shadow(0 8px 16px rgba(56, 189, 248, 0.4))"/>
    <!-- Medical Cross on Tablet -->
    <rect x="25" y="32" width="20" height="26" rx="4" fill="#ffffff"/>
    <rect x="18" y="39" width="34" height="12" rx="4" fill="#ffffff"/>
  </g>

  <!-- Cat Paws -->
  <!-- Left Paw holding tablet -->
  <ellipse cx="105" cy="195" rx="14" ry="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
  <!-- Right Paw waving -->
  <ellipse cx="215" cy="180" rx="15" ry="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
  <path d="M210 175 Q215 170 220 175" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
</svg>